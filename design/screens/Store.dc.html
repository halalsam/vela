<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@500;600;700&amp;family=Noto+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{t.grouped}}; color: {{t.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 0; z-index: 3"><dc-import name="StatusBar" dark="{{dark}}" hint-size="402px,54px"></dc-import></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 44px"></div>
    <h1 style="margin: -12px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">Store</h1>
    <label style="height: 40px; border-radius: 12px; background: {{t.fill}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{t.sec}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search countries</span>
      <input type="search" placeholder="Country or region" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 17px; color: {{t.label}}; outline: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </label>
    <div role="tablist" aria-label="Plan type" style="height: 36px; border-radius: 10px; background: {{t.fill}}; padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); box-sizing: border-box">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isCountries}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 6px; padding-inline-end: 14px">
        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
          <span style="font-size: 13px; font-weight: 600; color: {{t.sec}}; padding: 8px 16px 0">{{sec.letter}}</span>
          <div style="border-radius: 20px; background: {{t.card}}; overflow: hidden">
            <sc-for list="{{sec.items}}" as="c" hint-placeholder-count="2">
              <a href="Country.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; color: inherit; text-decoration: none">
                <span style="{{c.flag}}"></span>
                <span style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; align-self: stretch; border-bottom: {{c.border}}">
                  <span style="font-size: 17px">{{c.name}}</span>
                  <span style="font-size: 15px; color: {{t.sec}}">from <span style="font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-variant-numeric: tabular-nums">{{c.from}}</span></span>
                </span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.ter}}" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isRegions}}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 20px; background: {{t.card}}; overflow: hidden">
        <sc-for list="{{regions}}" as="r" hint-placeholder-count="5">
          <a href="Country.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 64px; color: inherit; text-decoration: none">
            <span style="width: 32px; height: 32px; border-radius: 16px; background: {{t.fill}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
            </span>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-bottom: {{r.border}}">
              <span style="font-size: 17px">{{r.name}}</span>
              <span style="font-size: 13px; color: {{t.sec}}">{{r.list}}</span>
            </span>
            <span style="font-size: 15px; color: {{t.sec}}; font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-variant-numeric: tabular-nums">{{r.from}}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isGlobal}}" hint-placeholder-val="{{ false }}">
      <a href="Country.dc.html" style="border-radius: 20px; background: {{t.card}}; padding: 20px; display: flex; flex-direction: column; gap: 12px; color: inherit; text-decoration: none">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
        </span>
        <span style="font-size: 20px; line-height: 25px; font-weight: 600">Global · one eSIM everywhere</span>
        <span style="font-size: 15px; line-height: 20px; color: {{t.sec}}">For multi-country trips. Coverage list on the plan page.</span>
        <span style="font-size: 17px; font-weight: 600">from <span style="font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif">₹1,499</span></span>
      </a>
    </sc-if>
  </div>

  <sc-if value="{{isCountries}}" hint-placeholder-val="{{ true }}">
    <div aria-label="Section index" style="position: absolute; right: 2px; top: 268px; display: flex; flex-direction: column; align-items: center; font-size: 11px; line-height: 15px; font-weight: 600; color: {{t.label}}; padding: 4px 2px">
      <sc-for list="{{letters}}" as="l" hint-placeholder-count="20"><span>{{l}}</span></sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; bottom: 0; z-index: 3"><dc-import name="TabBar" dark="{{dark}}" active="{{ 1 }}" hint-size="402px,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      grouped: '#000000', card: '#1C1C1E', label: '#FFFFFF', sec: 'rgba(235,235,245,0.6)', ter: 'rgba(235,235,245,0.3)', sep: 'rgba(84,84,88,0.65)', fill: 'rgba(118,118,128,0.24)', ink: '#FFFFFF', onInk: '#000000', segSel: '#636366'
    } : {
      grouped: '#F2F2F7', card: '#FFFFFF', label: '#000000', sec: 'rgba(60,60,67,0.6)', ter: 'rgba(60,60,67,0.3)', sep: 'rgba(60,60,67,0.29)', fill: 'rgba(118,118,128,0.12)', ink: '#000000', onInk: '#FFFFFF', segSel: '#FFFFFF'
    };
    var self = this;
    var seg = this.state.seg ?? 0;
    function flag(bg) { return { display: 'inline-block', width: '28px', height: '28px', borderRadius: '14px', background: bg, flexShrink: 0, boxShadow: 'inset 0 0 0 0.5px rgba(0,0,0,0.15)' }; }
    function h3(a, b, c) { return 'linear-gradient(' + a + ' 0 33.3%, ' + b + ' 33.3% 66.6%, ' + c + ' 66.6%)'; }
    function v3(a, b, c) { return 'linear-gradient(to right, ' + a + ' 0 33.3%, ' + b + ' 33.3% 66.6%, ' + c + ' 66.6%)'; }
    var data = [
      { letter: 'A', items: [['Armenia', '₹649', h3('#D90012', '#0033A0', '#F2A800')], ['Austria', '₹549', h3('#ED2939', '#FFFFFF', '#ED2939')]] },
      { letter: 'B', items: [['Belgium', '₹549', v3('#000000', '#FDDA24', '#EF3340')], ['Bulgaria', '₹499', h3('#FFFFFF', '#00966E', '#D62612')]] },
      { letter: 'C', items: [['Colombia', '₹799', 'linear-gradient(#FCD116 0 50%, #003893 50% 75%, #CE1126 75%)']] },
      { letter: 'E', items: [['Estonia', '₹499', h3('#0072CE', '#000000', '#FFFFFF')]] },
      { letter: 'F', items: [['France', '₹549', v3('#002654', '#FFFFFF', '#CE1126')]] },
      { letter: 'G', items: [['Germany', '₹549', h3('#000000', '#DD0000', '#FFCE00')]] }
    ];
    var sections = data.map(function (s) {
      return { letter: s.letter, items: s.items.map(function (it, i) { return { name: it[0], from: it[1], flag: flag(it[2]), border: i < s.items.length - 1 ? '0.5px solid ' + t.sep : '0' }; }) };
    });
    var segs = ['Countries', 'Regions', 'Global'].map(function (l, i) {
      var on = i === seg;
      return { label: l, on: on ? 'true' : 'false', pick: function () { self.setState({ seg: i }); },
        style: { border: 0, borderRadius: '8px', background: on ? t.segSel : 'transparent', color: t.label, font: 'inherit', fontSize: '13px', fontWeight: on ? 600 : 400, boxShadow: on ? '0 1px 3px rgba(0,0,0,0.12)' : 'none' } };
    });
    var regions = [['Asia', 'Japan, Thailand, Indonesia…', '₹899'], ['Europe', 'France, Germany, Italy…', '₹1,099'], ['Gulf', 'UAE, Qatar, Bahrain…', '₹999'], ['North America', 'USA, Canada, Mexico', '₹1,299'], ['Africa', 'Egypt, Kenya, Morocco…', '₹1,199']].map(function (r, i, a) {
      return { name: r[0], list: r[1], from: r[2], border: i < a.length - 1 ? '0.5px solid ' + t.sep : '0' };
    });
    return {
      t: t, dark: dark, segs: segs, sections: sections, regions: regions,
      isCountries: seg === 0, isRegions: seg === 1, isGlobal: seg === 2,
      letters: 'ABCDEFGHIJKLMNOPRSTUVYZ#'.split('')
    };
  }
}
</script>
</body>
</html>
