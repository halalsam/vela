<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Support chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 0; z-index: 3"><dc-import name="StatusBar" dark="{{dark}}" hint-size="402px,54px"></dc-import></div>
  <div style="position: absolute; left: 0; right: 0; top: 54px; height: 56px; display: grid; grid-template-columns: 60px minmax(0, 1fr) 60px; align-items: center; border-bottom: 0.5px solid {{t.sep}}; background: {{t.bg}}; z-index: 2">
    <a href="Profile.dc.html" aria-label="Back" style="margin-left: 8px; width: 44px; height: 44px; border-radius: 22px; background: {{t.fill}}; color: {{t.label}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 17px; font-weight: 600">Support</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: {{t.sec}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.greenFill}}"></span>Online</span>
    </span>
  </div>

  <div role="log" aria-label="Conversation" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 140px; padding: 16px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; overflow: hidden">
    <span style="align-self: center; font-size: 12px; color: {{t.sec}}; margin-bottom: 4px">Today 21:04</span>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="{{m.wrap}}">
        <div style="{{m.bubble}}">{{m.text}}</div>
        <sc-if value="{{m.card}}" hint-placeholder-val="{{ false }}">
          <a href="Install.dc.html" style="margin-top: 6px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{t.sep}}; color: inherit; text-decoration: none; max-width: 280px">
            <span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12a10 10 0 0 1 14 0M8 15a6 6 0 0 1 8 0M12 18.5v.5"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Turn on Data Roaming</span><span style="font-size: 13px; color: {{t.sec}}">Install guide · step 4</span></span>
          </a>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 34px; padding: 0 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.send}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{t.sep}}; background: {{t.bg}}; color: {{t.label}}; font: inherit; font-size: 15px">{{c.text}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Attach screenshot" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{t.glass}}; backdrop-filter: blur(20px); box-shadow: inset 0 0 0 0.5px {{t.sep}}; color: {{t.label}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <label style="flex-grow: 1; height: 44px; border-radius: 22px; background: {{t.glass}}; backdrop-filter: blur(20px); box-shadow: inset 0 0 0 0.5px {{t.sep}}; display: flex; align-items: center; padding: 0 6px 0 16px; gap: 6px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</span>
        <input type="text" placeholder="Message" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 17px; color: {{t.label}}; outline: none">
        <button type="button" aria-label="Send" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
        </button>
      </label>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#000000', label: '#FFFFFF', sec: 'rgba(235,235,245,0.6)', sep: 'rgba(84,84,88,0.65)', fill: 'rgba(118,118,128,0.24)', ink: '#FFFFFF', onInk: '#000000', agent: '#1C1C1E', greenFill: '#30D158', glass: 'rgba(30,30,32,0.7)'
    } : {
      bg: '#FFFFFF', label: '#000000', sec: 'rgba(60,60,67,0.6)', sep: 'rgba(60,60,67,0.29)', fill: 'rgba(118,118,128,0.12)', ink: '#000000', onInk: '#FFFFFF', agent: '#F2F2F7', greenFill: '#34C759', glass: 'rgba(255,255,255,0.75)'
    };
    var self = this;
    var extra = this.state.extra || [];
    var base = [
      ['a', 'Hi Sam, I’m Aisha from Landed. How can I help?'],
      ['u', 'My Japan eSIM installed but I have no data in Tokyo.'],
      ['a', 'Let’s fix that. Two quick checks: Data Roaming is on for the Landed line, and Cellular Data is set to Landed Japan.', true]
    ];
    var all = base.map(function (m) { return m; }).concat(extra.map(function (x) { return ['u', x]; }));
    var msgs = all.map(function (m) {
      var me = m[0] === 'u';
      return {
        text: m[1], card: !!m[2],
        wrap: { display: 'flex', flexDirection: 'column', alignItems: me ? 'flex-end' : 'flex-start' },
        bubble: { maxWidth: '290px', padding: '10px 14px', borderRadius: '20px', borderBottomRightRadius: me ? '6px' : '20px', borderBottomLeftRadius: me ? '20px' : '6px', background: me ? t.ink : t.agent, color: me ? t.onInk : t.label, fontSize: '17px', lineHeight: '22px' }
      };
    });
    var chips = ['That worked', 'Still no data', 'Send screenshot'].map(function (c) {
      return { text: c, send: function () { self.setState({ extra: extra.concat([c]) }); } };
    });
    return { t: t, dark: dark, msgs: msgs, chips: chips };
  }
}
</script>
</body>
</html>
