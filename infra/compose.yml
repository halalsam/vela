name: vela-${APP_ENV:?set APP_ENV}

x-app: &app
  image: ${IMAGE:-ghcr.io/halalsam/vela-server}:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: ./env/${APP_ENV}.env
  environment:
    APP_ENV: ${APP_ENV}
    DATABASE_URL: postgres://vela:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vela
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vela
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vela -d vela']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/server.js']
    deploy:
      replicas: ${API_REPLICAS:-2}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      default: {}
      edge:
        aliases: ['vela-${APP_ENV}-api']

  worker:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres: {}

networks:
  edge:
    external: true
