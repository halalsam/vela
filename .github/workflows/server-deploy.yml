name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/api/**
      - packages/utils/**
      - infra/**
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: Image tag (git SHA). Empty builds the current commit.
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vela-server

jobs:
  build:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    concurrency: deploy-${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: echo "ready=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APP_ENV: ${{ inputs.environment || 'staging' }}
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --exclude 'env/*.env' --exclude 'env/*.secrets' infra/ "$USER@$HOST:/srv/vela/infra/"
          ssh "$USER@$HOST" "/srv/vela/infra/deploy.sh $APP_ENV $TAG"
      - name: Skip notice
        if: steps.secrets.outputs.ready != 'true'
        run: echo "::notice::VPS_HOST is not set; image built but not deployed."
