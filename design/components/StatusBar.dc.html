<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" style="position: relative; width: 402px; height: 54px; color: {{fg}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 34px 0 40px; box-sizing: border-box">
  <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.2px; padding-top: 4px; font-variant-numeric: tabular-nums">9:41</span>
  <div style="position: absolute; left: 138px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000000"></div>
  <div style="display: flex; align-items: center; gap: 6px; padding-top: 4px" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .7 10.3 10.3 0 0 0 .8 3.6L2 4.9a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 4.1 7 7 0 0 0 3.2 6l1.2 1.3c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8 11.3 6.7 9.8c.3-.3.8-.5 1.3-.5z"></path></svg>
    <div style="position: relative; width: 25px; height: 12px; border: 1px solid {{batteryBorder}}; border-radius: 4px; box-sizing: border-box; padding: 1px">
      <div style="width: 80%; height: 100%; border-radius: 2px; background: {{fg}}"></div>
      <div style="position: absolute; right: -3px; top: 3.5px; width: 1.5px; height: 4px; border-radius: 0 1px 1px 0; background: {{batteryBorder}}"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"rtl":{"editor":"boolean","default":false},"$preview":{"width":402,"height":54}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    return {
      fg: dark ? '#FFFFFF' : '#000000',
      batteryBorder: dark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)',
      dir: this.props.rtl ? 'rtl' : 'ltr'
    };
  }
}
</script>
</body>
</html>
