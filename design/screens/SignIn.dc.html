<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@500;600;700&amp;family=Noto+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="StatusBar" dark="{{dark}}" hint-size="402px,54px"></dc-import></div>

  <sc-if value="{{choose}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 24px; right: 24px; top: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
      </div>
      <h1 style="margin: 8px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">Sign in to Landed</h1>
      <p style="margin: 0; font-size: 17px; line-height: 24px; color: {{t.sec}}">Your eSIMs, invoices and top-ups follow you to every device.</p>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 12px">
      <a href="Home.dc.html" aria-label="Sign in with Apple" style="height: 50px; border-radius: 14px; background: {{t.ink}}; color: {{t.onInk}}; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in with Apple</a>
      <a href="Home.dc.html" style="height: 50px; border-radius: 14px; background: {{t.bg}}; color: {{t.label}}; border: 1px solid {{t.sep}}; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box">Continue with Google</a>
      <button type="button" onClick="{{toPhone}}" style="height: 50px; border: 0; border-radius: 14px; background: {{t.fill}}; color: {{t.label}}; font: inherit; font-size: 17px; font-weight: 600">Continue with phone number</button>
      <p style="margin: 8px 0 0; text-align: center; font-size: 13px; line-height: 18px; color: {{t.sec}}">By continuing you agree to the <a href="#terms" style="color: {{t.label}}; font-weight: 600; text-decoration: none">Terms</a> and <a href="#privacy" style="color: {{t.label}}; font-weight: 600; text-decoration: none">Privacy Policy</a>.</p>
    </div>
  </sc-if>

  <sc-if value="{{phone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 8px; top: 54px; height: 44px; display: flex; align-items: center">
      <button type="button" onClick="{{back}}" aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{t.fill}}; color: {{t.label}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; top: 120px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Enter the code</h1>
        <p style="margin: 0; font-size: 17px; line-height: 22px; color: {{t.sec}}">Sent by SMS to +91 98 •••• 4410</p>
      </div>
      <div role="group" aria-label="6-digit code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
          <label style="{{b.style}}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Digit</span><input type="text" inputmode="numeric" maxlength="1" value="{{b.v}}" style="width: 100%; border: 0; background: transparent; text-align: center; font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-size: 28px; font-weight: 600; color: inherit; outline: none"></label>
        </sc-for>
      </div>
      <button type="button" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: {{t.sec}}; font: inherit; font-size: 15px; padding: 0 8px">Resend code in <span style="font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-variant-numeric: tabular-nums">0:24</span></button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 336px; background: {{t.kb}}; display: flex; flex-direction: column">
      <a href="Home.dc.html" style="height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: {{t.label}}; text-decoration: none; border-bottom: 0.5px solid {{t.sep}}">
        <span style="font-size: 11px; line-height: 13px; color: {{t.sec}}">From Messages</span>
        <span style="font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 2px">482 913</span>
      </a>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px 6px 40px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <div style="{{k.style}}">{{k.n}}</div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"view":{"editor":"enum","options":["choose","phone"],"default":"choose"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#000000', label: '#FFFFFF', sec: 'rgba(235,235,245,0.6)', sep: 'rgba(84,84,88,0.65)', fill: 'rgba(118,118,128,0.24)', ink: '#FFFFFF', onInk: '#000000', card: '#1C1C1E', kb: '#2C2C2E', key: '#5A5A5E'
    } : {
      bg: '#FFFFFF', label: '#000000', sec: 'rgba(60,60,67,0.6)', sep: 'rgba(60,60,67,0.29)', fill: 'rgba(118,118,128,0.12)', ink: '#000000', onInk: '#FFFFFF', card: '#F2F2F7', kb: '#D1D3D9', key: '#FFFFFF'
    };
    var view = this.state.view ?? this.props.view ?? 'choose';
    var self = this;
    var digits = ['4', '8', '2', '', '', ''];
    var boxes = digits.map(function (d, i) {
      var cur = i === 3;
      return { v: d, style: { position: 'relative', height: '60px', borderRadius: '14px', background: t.card, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: cur ? 'inset 0 0 0 2px ' + t.ink : 'none', color: t.label } };
    });
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(function (n) {
      return { n: n, style: { borderRadius: '8px', background: n === '' ? 'transparent' : (n === '⌫' ? 'transparent' : t.key), color: t.label, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '25px', boxShadow: n === '' || n === '⌫' ? 'none' : '0 1px 0 rgba(0,0,0,0.3)' } };
    });
    return {
      t: t, dark: dark, choose: view === 'choose', phone: view === 'phone', boxes: boxes, keys: keys,
      toPhone: function () { self.setState({ view: 'phone' }); },
      back: function () { self.setState({ view: 'choose' }); }
    };
  }
}
</script>
</body>
</html>
