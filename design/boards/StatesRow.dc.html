<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>States</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@500;600;700&amp;family=Noto+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2812px; height: 920px; display: flex; gap: 80px; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Loading · skeleton</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="Home" state="loading" hint-size="402px,874px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Low data · banner + orange ring</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="Home" state="lowData" hint-size="402px,874px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Offline · cached usage</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="Home" state="offline" hint-size="402px,874px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Empty · no eSIMs</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="MyEsims" state="empty" hint-size="402px,874px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Payment error</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="Checkout" state="error" hint-size="402px,874px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; flex-shrink: 0">
    <span style="font-size: 17px; line-height: 30px; font-weight: 600; color: #3C3C43">Expired</span>
    <div style="width: 402px; height: 874px; border-radius: 55px; overflow: hidden"><dc-import name="Usage" state="expired" hint-size="402px,874px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2812,"height":920}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
