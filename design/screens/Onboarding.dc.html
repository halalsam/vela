<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@500;600;700&amp;family=Noto+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="StatusBar" dark="{{dark}}" hint-size="402px,54px"></dc-import></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; height: 44px; display: flex; justify-content: flex-end; align-items: center">
    <a href="SignIn.dc.html" style="min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: flex-end; color: {{t.sec}}; font-size: 17px; text-decoration: none">Skip</a>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 120px; height: 380px; display: flex; align-items: center; justify-content: center">
    <sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
      <div style="position: relative; width: 320px; height: 320px">
        <div style="position: absolute; inset: 0; border-radius: 160px; background: {{t.card2}}"></div>
        <div style="position: absolute; left: 40px; top: 40px; width: 240px; height: 240px; border-radius: 120px; border: 1px solid {{t.sep}}"></div>
        <div style="position: absolute; left: 90px; top: 90px; width: 140px; height: 140px; border-radius: 70px; border: 1px solid {{t.sep}}"></div>
        <svg style="position: absolute; inset: 0" width="320" height="320" viewBox="0 0 320 320" fill="none" aria-hidden="true">
          <path d="M58 236 C 110 120, 210 92, 262 82" stroke="{{t.label}}" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"></path>
        </svg>
        <span style="position: absolute; left: 38px; top: 214px; {{f.in}}"></span>
        <span style="position: absolute; left: 132px; top: 118px; {{f.ae}}"></span>
        <span style="position: absolute; left: 242px; top: 58px; {{f.jp}}"></span>
        <div style="position: absolute; left: 196px; top: 70px; width: 40px; height: 40px; border-radius: 20px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; transform: rotate(-20deg)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15.5v-1.7l-8-5V3.5a1.5 1.5 0 0 0-3 0v5.3l-8 5v1.7l8-2.5v5.2l-2 1.5V21l3.5-1 3.5 1v-1.3l-2-1.5V13z" transform="rotate(90 12 12)"></path></svg>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 16px; background: {{t.card2}}; border-radius: 20px; padding: 18px 20px">
            <div style="width: 44px; height: 44px; border-radius: 22px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; font-family: 'SF Pro Rounded', ui-rounded, Nunito, sans-serif; font-size: 20px; font-weight: 700; flex-shrink: 0">{{st.n}}</div>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 17px; line-height: 22px; font-weight: 600">{{st.title}}</span>
              <span style="font-size: 15px; line-height: 20px; color: {{t.sec}}">{{st.body}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 32px">
        <div style="width: 120px; height: 120px; border-radius: 60px; background: {{t.card2}}; display: flex; align-items: center; justify-content: center">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5a6 6 0 0 0-6 6v4.2L4.3 15.6a1 1 0 0 0 .9 1.4h13.6a1 1 0 0 0 .9-1.4L18 12.7V8.5a6 6 0 0 0-6-6zM9.5 18.5a2.5 2.5 0 0 0 5 0z"></path></svg>
        </div>
        <div style="width: 100%; background: {{t.card2}}; border-radius: 22px; padding: 14px; display: flex; gap: 12px; box-sizing: border-box">
          <div style="width: 38px; height: 38px; border-radius: 9px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <div style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Running low in Japan</span><span style="font-size: 13px; color: {{t.sec}}">now</span></div>
            <span style="font-size: 15px; line-height: 20px">0.5 GB left. Top up in one tap — no reinstall.</span>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 528px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">{{copy.title}}</h1>
    <p style="margin: 0; font-size: 17px; line-height: 24px; color: {{t.sec}}">{{copy.body}}</p>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 16px; align-items: stretch">
    <div style="display: flex; justify-content: center; gap: 8px" aria-label="{{dotsLabel}}">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d}}"></span></sc-for>
    </div>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{next}}" style="height: 50px; border: 0; border-radius: 14px; background: {{t.ink}}; color: {{t.onInk}}; font: inherit; font-size: 17px; font-weight: 600">Continue</button>
    </sc-if>
    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <a href="SignIn.dc.html" style="height: 50px; border-radius: 14px; background: {{t.ink}}; color: {{t.onInk}}; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Allow notifications</a>
    </sc-if>
    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <a href="SignIn.dc.html" style="height: 44px; color: {{t.label}}; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: -8px">Not now</a>
    </sc-if>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <div style="height: 36px"></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"step":{"editor":"enum","options":[1,2,3],"default":1},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var t = dark ? {
      bg: '#000000', card2: '#1C1C1E', label: '#FFFFFF', sec: 'rgba(235,235,245,0.6)', sep: 'rgba(84,84,88,0.65)', ink: '#FFFFFF', onInk: '#000000', dot: 'rgba(235,235,245,0.3)'
    } : {
      bg: '#FFFFFF', card2: '#F2F2F7', label: '#000000', sec: 'rgba(60,60,67,0.6)', sep: 'rgba(60,60,67,0.18)', ink: '#000000', onInk: '#FFFFFF', dot: 'rgba(60,60,67,0.3)'
    };
    var step = Number(this.state.step ?? this.props.step ?? 1);
    function flagCss(bg, s) { return 'display: block; width: ' + s + 'px; height: ' + s + 'px; border-radius: ' + (s / 2) + 'px; background: ' + bg + '; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15), 0 0 0 4px ' + t.bg + ';'; }
    var f = {
      in: flagCss('radial-gradient(circle, #000080 0 9%, transparent 10%), linear-gradient(#FF9933 0 33.3%, #FFFFFF 33.3% 66.6%, #138808 66.6%)', 44),
      ae: flagCss('linear-gradient(to right, #EF3340 0 30%, transparent 30%), linear-gradient(#009739 0 33.3%, #FFFFFF 33.3% 66.6%, #000000 66.6%)', 52),
      jp: flagCss('radial-gradient(circle, #BC002D 0 30%, #FFFFFF 31%)', 44)
    };
    var copies = {
      1: { title: 'Land connected', body: 'Buy a data plan before you fly. It switches on the moment you land — no SIM swap, no roaming bill.' },
      2: { title: 'Three steps to data', body: 'Country, regional and global plans from a day to a month. Keep your number for calls and iMessage.' },
      3: { title: 'Stay ahead of your data', body: 'We’ll let you know when you’re running low or your plan is about to expire. Nothing else.' }
    };
    var self = this;
    var dots = [1, 2, 3].map(function (i) {
      return { width: i === step ? '22px' : '8px', height: '8px', borderRadius: '4px', background: i === step ? t.ink : t.dot };
    });
    return {
      t: t, f: f, dark: dark, copy: copies[step], dots: dots, dotsLabel: 'Page ' + step + ' of 3',
      s1: step === 1, s2: step === 2, s3: step === 3, notLast: step < 3,
      next: function () { self.setState({ step: Math.min(3, step + 1) }); },
      steps: [
        { n: '1', title: 'Pick your destination', body: 'Country, region or global plans' },
        { n: '2', title: 'Install in one tap', body: 'Straight into iPhone Settings' },
        { n: '3', title: 'Top up anytime', body: 'Add data without reinstalling' }
      ]
    };
  }
}
</script>
</body>
</html>
